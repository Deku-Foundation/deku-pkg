[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deku-pkg-prototype"
version = "0.1.0"
description = "Plan-only catalog validator and dependency planner for Deku Linux"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"

[project.scripts]
deku-pkg-plan = "deku_pkg.cli:main"

[tool.setuptools.packages.find]
include = ["deku_pkg*"]
