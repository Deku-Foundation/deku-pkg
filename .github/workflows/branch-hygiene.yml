name: Keep branch set small

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-hygiene-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prune:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with write access
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Keep only main and dev
        shell: bash
        run: |
          set -euo pipefail
          while read -r _ ref; do
            branch="${ref#refs/heads/}"
            case "$branch" in
              main|dev) continue ;;
            esac
            printf 'Deleting non-standard branch: %s\n' "$branch"
            git push origin --delete "$branch"
          done < <(git ls-remote --heads origin)
