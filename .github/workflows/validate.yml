name: Validate package planner

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate and plan example catalog
        run: PYTHONPATH=. python -m deku_pkg.cli --catalog examples/catalog.json --install hello-deku
