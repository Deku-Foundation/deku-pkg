name: Rust core checks

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action revision
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Generate lockfile once when bootstrapping the workspace
        run: test -f Cargo.lock || cargo generate-lockfile
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run unit tests
        run: cargo test --locked --workspace
      - name: Preserve the resolved lockfile for initial review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deku-pkg-cargo-lock-${{ github.run_id }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
